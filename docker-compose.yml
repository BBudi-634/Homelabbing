version: '3.8'

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    # Hardware acceleration for Intel QuickSync
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Persistent config storage
      - /DATA/AppData/jellyfin/config:/config
      # Media library (DAS)
      - /media/HD-1/media:/data
    ports:
      - "8096:8096"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    volumes:
      - /DATA/AppData/sonarr/config:/config
      - /media/HD-1:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    volumes:
      - /DATA/AppData/radarr/config:/config
      - /media/HD-1:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  seerr:
    image: seerr/seerr:latest
    container_name: seerr
    environment:
      - TZ=Asia/Jakarta
      - LOG_LEVEL=info
    volumes:
      - /DATA/AppData/big-bear-seerr/config:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    volumes:
      - /DATA/AppData/prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    volumes:
      - /DATA/AppData/sabnzbd/config:/config
      - /media/HD-1:/data
    ports:
      - "8080:8080"
    restart: unless-stopped    
      
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    volumes:
      - /DATA/AppData/bazarr/config:/config
      - /media/HD-1:/data
    ports:
      - "6767:6767"
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - /DATA/AppData/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    entrypoint: >
      /bin/sh -c "
      tailscaled --state=/var/lib/tailscale/tailscaled.state &
      sleep 10;
      tailscale web --listen 0.0.0.0:5252
      "
    restart: unless-stopped
